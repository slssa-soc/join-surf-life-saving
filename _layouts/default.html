<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% if page.title %}
        {{ page.title }} | Join Surf Life Saving SA
      {% else %}
        Join Surf Life Saving SA
      {% endif %}
    </title>
    <meta name="description" content="{{ page.description | default: site.description | default: 'Find and compare Surf Life Saving clubs in South Australia.' }}">

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>

  <body>
    {% include header.html %}

    <main>
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/lead-form.js' | relative_url }}" defer></script>
  </body>
</html>
