<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% if page.title %}
        {{ page.title }} | Club Directory
      {% else %}
        Club Directory
      {% endif %}
    </title>
    <meta name="description" content="{{ page.description | default: site.description | default: 'Find and compare Surf Life Saving clubs in South Australia.' }}">

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>

  <body>
    {% include header.html %}

    <main>
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/locations.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ '/assets/js/lead-form.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ "/assets/js/join-attribution.js" | relative_url }}" defer></script>
    <script src="{{ "/assets/js/ai.3.gbl.min.js" | relative_url }}" defer></script>
    <script src="{{ "/assets/js/join-analytics.js" | relative_url }}" defer></script>
    <script src="{{ "/assets/js/purify.min.js" | relative_url }}" defer></script>
    <script src="{{ "/assets/js/club-pages-live.js" | relative_url }}" defer></script>
  <script src="{{ "/assets/js/enquiry-rating.js" | relative_url }}" defer></script>
</body>
</html>
