<header class="site-header">
  <a
    class="brand brand--logo-only"
    href="{{ '/' | relative_url }}"
    aria-label="Join Surf Life Saving SA home"
  >
    <span class="brand-logo" aria-hidden="true">
      <img
        src="{{ '/assets/img/sls-logo.png' | relative_url }}"
        alt=""
      >
    </span>
  </a>

  <nav class="site-nav" aria-label="Primary navigation">
    <a
      href="{{ '/' | relative_url }}#clubs"
      {% if page.url == '/' %}class="is-active"{% endif %}
    >
      Find a club
    </a>

    <button
      class="nav-cta"
      type="button"
      data-open-club-helper
      data-helper-target-url="{{ '/' | relative_url }}?helper=open#clubs"
    >
      Help me choose
    </button>
  </nav>
</header>
